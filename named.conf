// BIND 9.20.21 - DNS1 Argentina Configuration
// Optimizado para VPS 1vCPU/1GB: performance + seguridad

options {
    directory "/var/cache/bind";
    
    // Interfaces
    listen-on { 0.0.0.0; };
    listen-on-v6 { ::0; };
    
    // Puertos
    port 53;
    tls-port 853;
    http-port 8080;
    
    // Recursion
    recursion yes;
    allow-recursion { any; };
    
    // Cache (256MB optimizado para 1GB RAM)
    max-cache-size 256M;
    
    // Response optimization (reduce tráfico)
    minimal-responses yes;
    minimal-any yes;
    nocookie-udp-size 1232;
    
    // Rate limiting (protección DDoS)
    rate-limit {
        responses-per-second 20;
        nxdomains-per-second 10;
        errors-per-second 5;
        all-per-second 80;
        window 15;
        slip 2;
        qps-scale 250;
        ipv4-prefix-length 32;
        ipv6-prefix-length 56;
    };
    
    // Security
    allow-query { any; };
    hide-identity yes;
    hide-version yes;
    
    // DNSSEC
    dnssec-validation auto;
    
    // Transfer
    allow-transfer { none; };
    
    // Prefetch
    prefetch 3600;
    
    // Statistics
    statistics-channels {
        inet 127.0.0.1 port 8053 allow { 127.0.0.1; };
    };
};

// Root zone hint file
zone "." IN {
    type hint;
    file "/etc/bind/db.root";
};

// Logging
logging {
    channel default_syslog {
        syslog local2;
        severity notice;
    };
    
    category default {
        default_syslog;
    };
};
